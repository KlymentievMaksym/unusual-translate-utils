[build-system]
requires = ["setuptools >= 77.0.3", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "GW-translate"
dynamic = ["version"]
requires-python = ">=3.10"
authors = [
  {name = "---", email = "---@gmail.com"},
]
description = "---"
readme = "README.md"
license = "MIT"
dependencies = [
    "tabulate",
    "rich",
    "textual"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "factory_boy",
]
check = [
    "ruff",
    "mypy",
    "types-tabulate",
    "types-factory-boy"
]

[project.urls]
Repository = "https://github.com/LagencyUA/GW-translate.git"
Issues = "https://github.com/LagencyUA/GW-translate/issues"

[project.scripts]
gwt-app = "translate_utils.main:main"
gwt-clean = "translate_utils.presentation.cli.cleanup_repeats:cleanup_repeats"
gwt-status = "translate_utils.presentation.cli.check_progress:check_translation_progress"

[tool.setuptools.packages.find]
where = ["src"]
include = ["translate_utils*"]

[tool.setuptools_scm]
root = "."
fallback_version = "1.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, W: Warnings, I: isort (auto-sort imports)
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true