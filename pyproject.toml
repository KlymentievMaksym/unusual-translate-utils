[build-system]
requires = ["setuptools >= 77.0.3", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "GW-translate"
dynamic = ["version"]
requires-python = ">=3.11"
authors = [
  {name = "---", email = "---@gmail.com"},
]
description = "---"
readme = "README.md"
license = "MIT"
dependencies = [
    "tabulate",
    "rich",
    "textual",
    
    "rapidfuzz",

    "requests"
]

[project.optional-dependencies]
dev = [
    "textual-dev",
]
test = [
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "factory_boy",
]
check = [
    "ruff",
    "mypy",
    "types-tabulate",
    "types-factory-boy"
]

[project.urls]
Repository = "https://github.com/LagencyUA/GW-translate.git"
Issues = "https://github.com/LagencyUA/GW-translate/issues"

[project.scripts]
gwt = "translate_utils.main:main"
gwt-app = "translate_utils.presentation.runners:run_app"
gwt-clean = "translate_utils.presentation.runners:run_clean"
gwt-compare = "translate_utils.presentation.runners:run_compare"
gwt-status = "translate_utils.presentation.runners:run_status"
gwt-check = "translate_utils.presentation.runners:run_check"

[tool.setuptools.packages.find]
where = ["src"]
include = ["translate_utils*"]

[tool.setuptools_scm]
root = "."
fallback_version = "1.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, W: Warnings, I: isort (auto-sort imports)
# UP: pyupgrade, B: flake8-bugbear (finds bugs), SIM: flake8-simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src", "tests"]