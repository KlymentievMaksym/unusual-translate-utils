name: Test Code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Cache Mypy
      uses: actions/cache@v6
      with:
        path: .mypy_cache
        key: mypy-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/*.py') }}
        restore-keys: |
          mypy-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

    - name: Install check dependencies
      run: make .venv/check-installed .venv/test-installed

    - name: Run Ruff Linter, Ruff Formatter and Mypy Static Type Checker
      run: make check

  build-and-test:
    needs: code-quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install test dependencies
      run: make .venv/test-installed

    - name: Run pytest with coverage
      run: make test-cov

    - name: Publish Coverage to Step Summary
      run: make coverage-report >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-html
        path: htmlcov/
        retention-days: 3